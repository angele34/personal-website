name: CI Checks

on:
  pull_request:
    branches: [ main, staging ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npx next lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Project
        run: npm run build